name: Create GitHub release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware artifacts from build
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: clusterbox-v120-build.yml
          workflow_conclusion: success
          name: clusterbox-v120-firmware
          path: output
          if_no_artifact_found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            output/output/*.bin
            output/bin/targets/ramips/mt7620/*sysupgrade*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

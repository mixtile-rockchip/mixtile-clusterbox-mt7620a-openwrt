name: Build ClusterBox V120 Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clusterbox-v120-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free extra disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions
          sudo apt-get clean
          df -h /

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-clusterbox-v120-dl-${{ hashFiles('build.sh', 'feeds.conf.default', 'config/BoardConfig/cluster-box-config') }}
          restore-keys: |
            ${{ runner.os }}-clusterbox-v120-dl-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools rsync unzip zlib1g-dev file wget swig ccache \
            subversion xsltproc zstd time

      - name: Select board config
        run: ./build.sh cluster-box-config

      - name: Prepare feeds
        run: |
          ./build.sh feeds_update
          ./build.sh feeds_install

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: |
          touch first_run
          ./build.sh firmware

      - name: Verify firmware output
        run: |
          test -f bin/targets/ramips/mt7620/openwrt-ramips-mt7620-cluster-box-control-V120-squashfs-sysupgrade-sd.bin
          test -s output/image-release-clusterbox-openwrt23-$(date '+%Y%m%d').bin

      - name: Generate artifact manifest
        run: |
          mkdir -p output
          find output -maxdepth 1 -type f | sort > output/artifacts.txt
          sha256sum output/* > output/sha256sums.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clusterbox-v120-firmware
          if-no-files-found: error
          path: |
            output/*
            bin/targets/ramips/mt7620/*.bin
            bin/targets/ramips/mt7620/*.manifest
            bin/targets/ramips/mt7620/*.buildinfo
            bin/targets/ramips/mt7620/*.json
